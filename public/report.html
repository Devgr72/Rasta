<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Footpath condition report — Rasta</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Archivo:wdth,wght@75..100,400..600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #111; --rule: #999; --faint: #666; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 15px/1.5 "Source Serif 4", Georgia, serif; }
  .page { max-width: 820px; margin: 0 auto; padding: 48px 40px 64px; }
  .ref { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid var(--ink); padding-bottom: 12px; margin-bottom: 28px; font-family: "Archivo", system-ui, sans-serif; font-size: 12px; color: var(--faint); font-variation-settings: "wdth" 85; }
  .ref b { display: block; color: var(--ink); font-size: 14px; letter-spacing: .04em; }
  h1 { font-size: 30px; font-weight: 600; margin: 0 0 6px; line-height: 1.15; }
  .sub { color: var(--faint); margin-bottom: 26px; }
  h2 { font-size: 17px; font-weight: 600; margin: 32px 0 10px; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; font-family: "Archivo", system-ui, sans-serif; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #ddd; vertical-align: top; }
  th { font-weight: 600; font-variation-settings: "wdth" 85; color: var(--faint); border-bottom: 1px solid var(--rule); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin: 20px 0; }
  .facts div { border-top: 1px solid var(--rule); padding-top: 8px; }
  .facts dt { font-family: "Archivo", system-ui, sans-serif; font-size: 11px; color: var(--faint); font-variation-settings: "wdth" 85; }
  .facts dd { margin: 2px 0 0; font-size: 24px; font-weight: 600; }
  .verdicts li { margin: 4px 0; }
  .verdicts b { font-weight: 600; }
  .fail::before { content: "✕ "; color: #B91C1C; } .pass::before { content: "✓ "; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .photo { position: relative; border: 1px solid #ddd; }
  .photo img { display: block; width: 100%; }
  .photo .bx { position: absolute; border: 2px solid #B91C1C; }
  .photo .bx span { position: absolute; left: -2px; top: 100%; background: #B91C1C; color: #fff; font: 10px/1.3 "Archivo", sans-serif; padding: 1px 4px; white-space: nowrap; }
  .photo figcaption { font-family: "Archivo", sans-serif; font-size: 12px; color: var(--faint); padding: 6px 8px; }
  .foot { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--rule); font-family: "Archivo", sans-serif; font-size: 11px; color: var(--faint); }
  .print { position: fixed; top: 16px; right: 16px; font: 13px "Archivo", sans-serif; padding: 8px 14px; border: 1px solid var(--ink); background: #fff; cursor: pointer; }
  @media print { .print { display: none; } .page { padding: 0; } }
  @media (max-width: 600px) { .facts { grid-template-columns: 1fr 1fr; } .photos { grid-template-columns: 1fr; } .page { padding: 28px 18px; } }
</style>
</head>
<body>
<button class="print" onclick="print()">Print or save as PDF</button>
<main class="page" id="page"><p>Loading…</p></main>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const inr = (n) => '₹' + Math.round(n || 0).toLocaleString('en-IN');
  const page = document.getElementById('page');
  try {
    const [seg, std] = await Promise.all([fetch(`/api/segments/${id}`).then((r) => { if (!r.ok) throw new Error('segment not found'); return r.json(); }), fetch('/api/standards').then((r) => r.json())]);
    const types = Object.fromEntries(std.hazard_types.map((t) => [t.id, t]));
    const ref = `RST-${new Date(seg.created_at).getFullYear()}-${String(seg.id).padStart(4, '0')}`;
    const byAuth = {};
    for (const h of seg.hazards) byAuth[h.authority || 'Other'] = (byAuth[h.authority || 'Other'] || 0) + (h.cost_inr || 0);
    document.title = `${ref} — ${seg.name}`;
    page.innerHTML = `
      <div class="ref"><div>Footpath condition report<br>Crowdsourced field observation · Rasta</div><div style="text-align:right"><b>${ref}</b>${new Date(seg.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</div></div>
      <h1>${esc(seg.name)}</h1>
      <p class="sub">From ${seg.start.lat.toFixed(5)}, ${seg.start.lng.toFixed(5)} to ${seg.end.lat.toFixed(5)}, ${seg.end.lng.toFixed(5)} · ${seg.length_m} m · surface: ${esc(seg.surface_type)}</p>
      <dl class="facts">
        <div><dt>Accessibility score</dt><dd>${seg.score}<span style="font-size:14px;color:var(--faint)"> / 100</span></dd></div>
        <div><dt>Hazards recorded</dt><dd>${seg.hazards.length}</dd></div>
        <div><dt>Minimum clear width</dt><dd>${seg.clear_width_m != null ? seg.clear_width_m.toFixed(1) + ' m' : '—'}</dd></div>
        <div><dt>Indicative repair cost</dt><dd>${inr(seg.total_cost_inr)}</dd></div>
      </dl>
      <h2>Who can use this footpath</h2>
      <ul class="verdicts">
        ${['walk', 'wheelchair', 'senior'].map((k) => `<li class="${seg.verdicts[k].ok ? 'pass' : 'fail'}"><b>${{ walk: 'Pedestrian', wheelchair: 'Wheelchair user', senior: 'Senior citizen' }[k]}</b> — ${esc(seg.verdicts[k].reason)}</li>`).join('')}
      </ul>
      <h2>Schedule of hazards</h2>
      <table><thead><tr><th>#</th><th>Hazard</th><th>Observation</th><th>Standard</th><th>Authority</th><th class="n">Severity</th><th class="n">Est. cost</th></tr></thead>
      <tbody>${seg.hazards.map((h, i) => `<tr><td>${i + 1}</td><td>${esc(types[h.type_id]?.label_en || h.type_id)}</td><td>${esc(h.note)}</td><td>${esc(types[h.type_id]?.standard_ref || '')}</td><td>${esc(h.authority || '')}</td><td class="n">${h.severity} / 5</td><td class="n">${h.cost_inr ? inr(h.cost_inr) : 'enforcement'}</td></tr>`).join('') || '<tr><td colspan="7">No hazards recorded.</td></tr>'}</tbody>
      <tfoot><tr><th colspan="6">Total indicative cost</th><th class="n">${inr(seg.total_cost_inr)}</th></tr></tfoot></table>
      <h2>Cost by responsible authority</h2>
      <table><tbody>${Object.entries(byAuth).map(([a, c]) => `<tr><td><b>${esc(a)}</b> — ${esc(std.authorities?.[a] || '')}</td><td class="n">${inr(c)}</td></tr>`).join('') || '<tr><td>None</td></tr>'}</tbody></table>
      ${seg.photos.some((p) => p.url) ? `<h2>Photographic evidence</h2><div class="photos">${seg.photos.filter((p) => p.url).map((p, i) => `<figure class="photo" style="margin:0"><div style="position:relative"><img src="${p.url}" alt="">${seg.hazards.filter((h) => h.photo_id === p.id && h.bbox).map((h) => `<div class="bx" style="left:${h.bbox.x * 100}%;top:${h.bbox.y * 100}%;width:${h.bbox.w * 100}%;height:${h.bbox.h * 100}%"><span>${esc(types[h.type_id]?.label_en || h.type_id)}</span></div>`).join('')}</div><figcaption>Photo ${i + 1}${p.observations ? ' — ' + esc(p.observations) : ''}</figcaption></figure>`).join('')}</div>` : ''}
      <p class="foot">Observations were recorded by a member of the public and graded automatically against the Harmonised Guidelines and Standards for Universal Accessibility in India (2021) and IRC:103-2012. Costs are indicative 2025 Delhi rates for scoping and are not an estimate for tender. Reference ${ref}.</p>`;
  } catch (err) { page.innerHTML = `<h1>Report unavailable</h1><p>${esc(err.message)}</p>`; }
})();
</script>
</body>
</html>
